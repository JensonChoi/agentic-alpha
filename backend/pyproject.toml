[project]
name = "agentic-alpha"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.9",
    "httpx>=0.27",
    "pandas>=2.2",
    "numpy>=2.0",
    "pyarrow>=17",
    "exchange-calendars>=4.5",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "yfinance==0.2.66",
]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
